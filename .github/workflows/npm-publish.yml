name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write   # 打 tag 需要
  id-token: write   # --provenance 签名需要（OIDC）
  actions: read     # 下载 build-rsx-sc-rust 的产物需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: 读版本号
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 已存在则跳过（幂等）
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 打 tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      # 二进制不入 git（每个 ~4.7 MB），发布前从最近一次成功的 Rust 构建
      # 产物里取回来。取不到就硬失败——发一个没有二进制的包比不发更糟。
      - name: 取构建产物里的二进制
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-rsx-sc-rust --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::找不到成功的 build-rsx-sc-rust 运行，无法取得二进制"
            exit 1
          fi

          # 过期闸门：产物必须对应当前 rust/ 源码。
          # publish 与 build 都由 push 触发，两者并发时 publish 取到的是**上一次**
          # 构建的产物 —— 那样发出去的包 JS 是新的、二进制是旧的，而 region
          # 的坐标语义在 0.4.0 变过，这种错配会静默产生错误截图。
          # 判据是「产物来源提交之后 rust/ 有没有再改动」：纯 JS 发版 rust/ 不变，
          # 闸门放行；改了 Rust 却没过 build，则明确拒绝。
          BUILD_SHA=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json headSha --jq .headSha)
          if ! git diff --quiet "$BUILD_SHA" HEAD -- rust/; then
            echo "::error::产物来自 ${BUILD_SHA}，之后 rust/ 又有改动，二进制已过期，拒绝发布。"
            echo "::error::等 build-rsx-sc-rust 跑完后重新触发发布（push 一个空提交或重跑本 workflow）。"
            exit 1
          fi
          echo "使用构建 run: $RUN_ID (来源 $BUILD_SHA)"

          rm -rf /tmp/art
          for KEY in win32-x64 linux-x64; do
            BIN=rsx-sc-rust
            [ "$KEY" = "win32-x64" ] && BIN=rsx-sc-rust.exe
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "rsx-sc-rust-$KEY" --dir "/tmp/art/$KEY"
            mkdir -p "binaries/$KEY"
            cp "/tmp/art/$KEY/$BIN" "binaries/$KEY/$BIN"
            chmod +x "binaries/$KEY/$BIN"
          done
          echo "--- 待打包的 binaries/ ---"
          ls -lh binaries/*/

      - name: 发布
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}