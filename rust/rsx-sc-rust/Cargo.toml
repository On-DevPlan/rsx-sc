[package]
name = "rsx-sc-rust"
version = "0.5.1"
edition = "2021"
description = "rsx-sc screenshot capture binary — standalone Rust port of the tauri2 capture pipeline (no GUI framework, JSONL stdio)."
authors = ["On-DevPlan"]
license = "MIT"
repository = "https://github.com/On-DevPlan/rsx-sc"

[[bin]]
name = "rsx-sc-rust"
path = "src/main.rs"

[dependencies]
# v1 only supports Windows + Linux for screen capture; macOS is a stub.
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "signal"] }
# Native fullscreen selection overlay (ported from tauri2's capture_window.rs).
# Same crates + versions as the tauri2 app, minus tauri itself.
softbuffer = "0.4"
winit = { version = "0.30", features = ["rwh_06"] }

[features]
default = []

[profile.dev.package.screenshots]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.softbuffer]
opt-level = 2

[profile.dev.package.winit]
opt-level = 2

# Release profile is tuned for small binary size: this tool spawns a subprocess
# from a Node.js CLI, so a 3 MB binary is friendlier than a 12 MB one.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"